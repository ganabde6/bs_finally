server:
  port: 9000
  servlet:
    context-path: /
  tomcat:
    # Windows 环境下禁用 NIO,使用 BIO
    accept-count: 100
    max-threads: 200

spring:
  application:
    name: zhixue-ai-backend
  mvc:
    # 无匹配路由时抛出异常,便于全局异常处理记录 404 路径
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhixue_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhixue.ai.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: zhixue-ai-secret-key-2024-very-long-for-hs256-signing-algorithm
  expiration: 86400000  # 24小时(毫秒)
  header: Authorization

# 文件上传配置
file:
  upload-dir: ./upload
  allowed-types: jpg,jpeg,png,gif,mp3,mp4,wav,pdf,doc,docx

# 日志
logging:
  level:
    com.zhixue.ai: debug
    org.springframework.security: info

# AI 服务配置
ai:
  # AI 服务提供者: local(本地规则) / dashscope(通义千问) / deepseek
  provider: dashscope

  # 通义千问(DashScope)配置
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:sk-ws-H.ELMDYLL.1pb6.MEUCIG1i8kr33RxoEtPG6CDUZ8QeuFwWRt1ub-QPjmb_XQDLAiEA6oMLVZcIMQ4ZrTZPfrZ6HRhVAaOylXHjB8sRLE1v9os}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus

  # DeepSeek 配置
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
